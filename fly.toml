# API de production sur Fly.io (région Paris). Déploiement : .github/workflows/deploy-production.yml
# Secrets (jamais ici) : fly secrets set DATABASE_URL=… ORDER_TOKEN_SECRET=… (docs/mise-en-production.md)
app = "splash360-commande-api"
primary_region = "cdg"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  TRUST_PROXY = "1"
  # Fidélité de démonstration tant que l'API Splash360 n'est pas branchée ; connexion par e-mail coupée.
  LOYALTY = "demo"
  LOYALTY_DEMO_LOGIN = "0"

[http_service]
  internal_port = 8787
  force_https = true
  # Toujours une machine en marche : expiration des commandes et relances vers la caisse tournent en tâche de fond.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
