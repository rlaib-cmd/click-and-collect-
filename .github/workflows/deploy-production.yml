name: Déploiement production

# Lancé à la main (onglet Actions), jamais automatiquement : la production se met à jour sur décision.
on:
  workflow_dispatch:
    inputs:
      migrate:
        description: Appliquer les migrations Supabase avant le déploiement
        type: boolean
        default: true

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrations puis API
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Migrations de la base de production
        if: ${{ inputs.migrate }}
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: ${{ inputs.migrate }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push

      - name: Déploiement de l'API sur Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master
      - env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.toml

      - name: Vérification
        run: curl --fail --retry 10 --retry-delay 6 https://splash360-commande-api.fly.dev/ready
